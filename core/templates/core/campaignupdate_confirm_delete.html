{% extends "base.html" %}

{% block title %}Delete update — ODP{% endblock %}

{% block content %}
  <div class="mx-auto max-w-lg px-4 py-12 sm:px-6">
    <div class="card p-6 md:p-8">
      <h1 class="font-display text-2xl font-extrabold tracking-tight md:text-3xl">
        Delete &ldquo;{{ object.title }}&rdquo;?
      </h1>
      <p class="mt-3 leading-relaxed text-ink/70">
        This permanently removes this update from the &ldquo;{{ campaign.title }}&rdquo; timeline.
      </p>

      <form method="post" class="mt-6 flex flex-wrap items-center gap-3">
        {% csrf_token %}
        <button
          type="submit"
          class="inline-flex items-center justify-center gap-2 rounded-full bg-rose-solid px-6 py-3 font-semibold text-white transition hover:bg-rose-500 active:scale-[0.98]"
        >Yes, delete this update</button>
        <a href="{% url 'campaign-detail' campaign.slug %}" class="btn-ghost">Cancel</a>
      </form>
    </div>
  </div>
{% endblock %}
