services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-odp}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    image: miketorreno/online-donation-platform:${COMMIT_SHA:-latest}
    restart: unless-stopped
    # Bind to the loopback interface only: the host Nginx reverse proxy
    # forwards requests here, so the app is never exposed publicly directly.
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:${WEB_PORT:-8000}"
    env_file:
      - .env
    # TCP-connect healthcheck on the app port: unlike an HTTP GET it is immune
    # to the production settings (SECURE_SSL_REDIRECT 301s and ALLOWED_HOSTS
    # 400s), so it only reflects whether gunicorn is actually listening.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,os; s=socket.create_connection(('127.0.0.1', int(os.environ.get('WEB_PORT','8000'))), 2); s.close()"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Host bind-mounts shared with the host-level Nginx reverse proxy so it
      # can serve static files and user-uploaded media directly.
      - ${HOST_STATIC_DIR:-./staticfiles}:/app/staticfiles
      - ${HOST_MEDIA_DIR:-./media}:/app/media

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    image: miketorreno/online-donation-platform:${COMMIT_SHA:-latest}
    restart: unless-stopped
    command: ["celery", "-A", "odp", "worker", "--loglevel=info"]
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  beat:
    image: miketorreno/online-donation-platform:${COMMIT_SHA:-latest}
    restart: unless-stopped
    command: ["celery", "-A", "odp", "beat", "--loglevel=info"]
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

volumes:
  pgdata:
