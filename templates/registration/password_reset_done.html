{% extends "base.html" %}

{% block title %}Check your email — ODP{% endblock %}

{% block content %}
  <div class="card mx-auto my-10 max-w-md p-8 text-center">
    <div class="mx-auto mb-4 h-12 w-12 rounded-full bg-pine-50 flex items-center justify-center">
      <span class="font-display text-2xl font-extrabold text-pine-700">✉</span>
    </div>
    <h1 class="font-display text-3xl font-bold tracking-tight">Check your email</h1>
    <p class="mt-3 text-sm leading-relaxed text-ink/60">
      If an account exists for that address, we've emailed you a link to reset
      your password. It may take a few minutes to arrive.
    </p>
    <a href="{% url 'login' %}" class="btn-primary mt-6">Back to log in</a>
  </div>
{% endblock %}
