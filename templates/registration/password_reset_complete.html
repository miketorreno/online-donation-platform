{% extends "base.html" %}

{% block title %}Password reset — ODP{% endblock %}

{% block content %}
  <div class="card mx-auto my-10 max-w-md p-8 text-center">
    <h1 class="font-display text-3xl font-bold tracking-tight">Password updated</h1>
    <p class="mt-3 text-sm leading-relaxed text-ink/60">
      Your password has been reset. You can now log in with your new password.
    </p>
    <a href="{% url 'login' %}" class="btn-primary mt-6">Log in</a>
  </div>
{% endblock %}
