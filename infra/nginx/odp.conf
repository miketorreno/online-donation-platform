# Host-level Nginx reverse proxy for the ODP Django app.
# Place in /etc/nginx/sites-available/ and symlink to /etc/nginx/sites-enabled/,
# then `nginx -t && systemctl reload nginx`.
#
# Assumes:
#   - `web` container publishes gunicorn on 127.0.0.1:8000 (see compose.yaml)
#   - static/media directories are bind-mounted to these host paths
#     (override HOST_STATIC_DIR / HOST_MEDIA_DIR in the project .env)
#   - your domain in server_name

# HTTP -> HTTPS (enable once certbot issues a cert; keep a redirect otherwise)
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # Temporary: redirect to HTTPS. If you are not using TLS yet, comment
    # this block out and serve on port 80 directly.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    # Managed by certbot: `certbot --nginx -d example.com`
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    client_max_body_size 10M;

    # Static files collected by `manage.py collectstatic` into the host bind dir.
    location /static/ {
        alias /srv/online-donation-platform/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # User-uploaded media (campaign cover images, avatars, update photos).
    location /media/ {
        alias /srv/online-donation-platform/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Everything else -> gunicorn.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
