name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: "docker.io"
  IMAGE_NAME: "online-donation-platform"
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      short_sha: ${{ steps.slug.outputs.sha8 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get short commit hash
        id: slug
        run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.slug.outputs.sha8 }}
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,IMAGE_NAME
          script: |
            cd /home/srvr/online-donation-platform

            FULL_IMAGE_PATH="${DOCKERHUB_USERNAME}/${IMAGE_NAME}"

            # Update the APP_TAG environment variable in .env file
            if grep -q "COMMIT_SHA=" .env; then
              sed -i "s/COMMIT_SHA=.*/COMMIT_SHA=${{ needs.build-and-push.outputs.short_sha }}/" .env
            else
              echo "COMMIT_SHA=${{ needs.build-and-push.outputs.short_sha }}" >> .env
            fi

            # Pull the explicit new image and restart the web container
            docker compose pull web
            docker compose up -d web

            # Run Django specific tasks
            docker compose exec -T web python manage.py migrate --noinput
            docker compose exec -T web python manage.py collectstatic --noinput

            # Prune old images to save disk space
            docker image prune -f
