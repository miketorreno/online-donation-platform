name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # DEBUG must be True here: with DEBUG=False the production security
      # block turns on SECURE_SSL_REDIRECT, and every view test would get a
      # 301 (empty body) instead of rendered HTML. Security checks below
      # happen via `check --deploy` instead.
      DEBUG: "True"
      SECRET_KEY: "ci-only-do-not-use-in-prod"
      # SQLite backend, since no Postgres service is provisioned here.
      DB_ENGINE: django.db.backends.sqlite3
      DB_NAME: /tmp/odp_ci.sqlite3
      # Non-empty values are required: settings.py reads these via
      # python-decouple with no defaults for USER/PASSWORD and casts PORT to
      # int, so an empty string crashes settings import.
      DB_USER: ci
      DB_PASSWORD: ci
      DB_HOST: ci
      DB_PORT: "5432"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run python manage.py test

      - name: Deployment sanity check
        run: uv run python manage.py check --deploy

  build:
    name: Build image (verify only)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: online-donation-platform:ci
